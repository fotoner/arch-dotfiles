#!/usr/bin/nft -f
# /etc/nftables.conf: 방화벽 (맥의 방화벽처럼). 밖에서 먼저 들어오는 연결은 막고, 내가 연 연결의 응답만 받는다.
# Tailscale·NordVPN 같은 프로그램이 따로 넣는 규칙은 건드리지 않도록, 전체를 지우지(flush ruleset) 않고 이 표만 다시 만든다.
# 고친 뒤 적용: sudo systemctl restart nftables   지금 규칙 보기: sudo nft list table inet filter

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "망가진 연결"
    ct state { established, related } accept comment "내가 연 연결의 응답 (웹, 업데이트, VPN 등)"
    iif lo accept comment "이 컴퓨터 안의 프로그램끼리"
    meta l4proto { icmp, ipv6-icmp } accept comment "ping, IPv6 주소 찾기"
    ip6 saddr fe80::/10 udp dport 546 accept comment "DHCPv6 (IPv6 주소 받기)"
    udp dport 5353 accept comment "mDNS: 같은 Wi-Fi의 기기 찾기 (Spotify Connect, 크롬캐스트, 프린터)"
    iifname "tailscale0" accept comment "Tailscale로 연결된 내 기기들"
    udp dport 41641 accept comment "Tailscale 직접 연결 (중계 서버를 거치지 않게)"

    # 나머지는 막는다. 같은 네트워크의 앱이 오래 기다리지 않도록 '거부' 응답을 초당 5번까지만 보낸다
    pkttype host limit rate 5/second reject with icmpx type admin-prohibited
  }
}
