# kitty: 터미널 설정. 색은 current-theme.conf (Catppuccin Mocha)
# 다른 색 테마로 바꾸려면: kitty +kitten themes

font_family JetBrainsMono Nerd Font
font_size   11.0

window_padding_width 8
# 배경이 비치게 (1.0이면 불투명). 비친 뒤쪽은 Hyprland가 옅게 흐린다
background_opacity   0.8
# 실행 중에 조절: Ctrl+Shift+A 다음 M(더 불투명) / L(더 투명) / 1(불투명) / D(원래대로)
dynamic_background_opacity yes
enable_audio_bell    no

tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
