# kitty: 터미널 설정. 색은 current-theme.conf (Catppuccin Mocha)
# 다른 색 테마로 바꾸려면: kitty +kitten themes

font_family JetBrainsMono Nerd Font
font_size   11.0

window_padding_width 8
# 배경이 비치게 (1.0이면 불투명). 비친 뒤쪽은 Hyprland가 옅게 흐린다
background_opacity   0.8
# 실행 중에 조절: Ctrl+Shift+A 다음 M(더 불투명) / L(더 투명) / 1(불투명) / D(원래대로)
dynamic_background_opacity yes
enable_audio_bell    no

# 커서가 움직이면 꼬리 같은 잔상이 따라온다 (색은 커서 색)
# cursor_trail: 커서가 이만큼(ms) 머문 뒤 움직일 때부터 잔상. 0이면 끔
cursor_trail                 3
# 잔상이 사라지는 빠르기 (가장 빠름 / 가장 느림, 초)
cursor_trail_decay           0.1 0.4
# 이 칸 수보다 멀리 움직일 때만 잔상 (글자 하나 칠 때는 안 나옴)
cursor_trail_start_threshold 2

tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# 맥 터미널처럼 탭 다루기. Hyprland가 터미널에는 Alt 조합을 그대로 넘기므로 여기서 Alt = 맥의 ⌘으로 받는다
# (Alt+T 새 탭, Alt+W 탭 닫기, Alt+C/V 복사·붙여넣기는 Hyprland가 Ctrl+Shift 조합으로 바꿔 보낸다)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+shift+] next_tab
map alt+shift+[ previous_tab
# 글자 크기: Alt+= 크게, Alt+- 작게, Alt+0 원래대로 (맥의 ⌘= ⌘- ⌘0)
map alt+equal change_font_size all +1.0
map alt+minus change_font_size all -1.0
map alt+0 change_font_size all 0

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
