# kitty: 터미널 설정. 색은 current-theme.conf (Catppuccin Mocha)
# 다른 색 테마로 바꾸려면: kitty +kitten themes

font_family JetBrainsMono Nerd Font
font_size   11.0

window_padding_width 8
# 배경이 비치게 (1.0이면 불투명). 비친 뒤쪽은 Hyprland가 옅게 흐린다
background_opacity   0.8
# 실행 중에 조절: Ctrl+Shift+A 다음 M(더 불투명) / L(더 투명) / 1(불투명) / D(원래대로)
dynamic_background_opacity yes
enable_audio_bell    no

# 커서가 움직이면 꼬리 같은 잔상이 따라온다 (색은 커서 색)
# cursor_trail: 커서가 이만큼(ms) 머문 뒤 움직일 때부터 잔상. 0이면 끔
cursor_trail                 3
# 잔상이 사라지는 빠르기 (가장 빠름 / 가장 느림, 초)
cursor_trail_decay           0.1 0.4
# 이 칸 수보다 멀리 움직일 때만 잔상 (글자 하나 칠 때는 안 나옴)
cursor_trail_start_threshold 2

tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
