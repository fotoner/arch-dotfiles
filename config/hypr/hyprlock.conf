# hyprlock: 잠금 화면. 공식 예시(hyprlock v0.9.6 assets/example.conf)를 바탕으로 맥 잠금 화면처럼 배치했다:
# 위에 날짜와 큰 시계, 가운데 사용자와 암호 입력, 오른쪽 아래 배터리. 색은 Catppuccin Mocha
# 입력 중인 암호 지우기: ESC, Ctrl+U

$font = Inter
$text = rgb(cdd6f4)

general {
    hide_cursor = true
}

# 지문으로 풀려면 fprintd로 지문을 등록한 뒤 주석을 푼다.
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = 지문을 대세요
#         present_message = 확인 중...
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.8
}

# 날짜 (예: 10월 8일 목요일)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ko_KR.UTF-8 date +"%-m월 %-d일 %A"
    color = $text
    font_size = 22
    font_family = $font

    position = 0, -90
    halign = center
    valign = top
}

# 큰 시계
label {
    monitor =
    text = <b>$TIME</b>
    color = $text
    font_size = 96
    font_family = $font

    position = 0, -125
    halign = center
    valign = top
}

# 사용자 사진 자리: 보라색 원 안에 이름 첫 글자
shape {
    monitor =
    size = 96, 96
    color = rgba(cba6f7ff)
    rounding = -1
    border_size = 0

    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = rgb(1e1e2e)
    font_size = 40
    font_family = $font

    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 16
    font_family = $font

    position = 0, 18
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    inner_color = rgba(1e1e2e99)

    outer_color = rgba(cba6f7ee) rgba(89b4faee) 45deg
    check_color = rgba(a6e3a1ee) rgba(94e2d5ee) 120deg
    fail_color = rgba(f38ba8ee) rgba(eba0acee) 40deg

    font_color = $text
    fade_on_empty = false
    rounding = -1
    dots_center = true

    font_family = $font
    placeholder_text = 암호 입력
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# 배터리
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $text
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = -30, 30
    halign = right
    valign = bottom
}
