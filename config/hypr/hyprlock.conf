# hyprlock: 잠금 화면. 공식 예시(hyprlock v0.9.6 assets/example.conf)를 바탕으로 맥 잠금 화면처럼 배치했다:
# 위에 날짜와 큰 시계, 가운데 프로필 사진(~/.face)과 암호 입력, 오른쪽 아래 배터리, 왼쪽 아래 입력기 배지. 색은 Catppuccin Mocha
# 입력 중인 암호 지우기: ESC, Ctrl+U

$font = Inter
$text = rgb(cdd6f4)

general {
    # 좌하단 입력기 배지를 누를 수 있게 커서를 보인다
    hide_cursor = false
}

# 지문으로 풀려면 fprintd로 지문을 등록한 뒤 주석을 푼다.
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = 지문을 대세요
#         present_message = 확인 중...
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.8
}

# 날짜 (예: 10월 8일 목요일)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ko_KR.UTF-8 date +"%-m월 %-d일 %A"
    color = $text
    font_size = 22
    font_family = $font

    position = 0, -90
    halign = center
    valign = top
}

# 큰 시계
label {
    monitor =
    text = <b>$TIME</b>
    color = $text
    font_size = 96
    font_family = $font

    position = 0, -125
    halign = center
    valign = top
}

# 사용자 사진 자리: 보라색 원 안에 이름 첫 글자
shape {
    monitor =
    size = 96, 96
    color = rgba(cba6f7ff)
    rounding = -1
    border_size = 0

    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = rgb(1e1e2e)
    font_size = 40
    font_family = $font

    position = 0, 90
    halign = center
    valign = center
}

# 프로필 사진 (~/.face). 없으면 바로 위의 첫 글자 원이 보인다
image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(cba6f7ee)

    position = 0, 90
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 16
    font_family = $font

    position = 0, 18
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    inner_color = rgba(1e1e2e99)

    outer_color = rgba(cba6f7ee) rgba(89b4faee) 45deg
    check_color = rgba(a6e3a1ee) rgba(94e2d5ee) 120deg
    fail_color = rgba(f38ba8ee) rgba(eba0acee) 40deg
    capslock_color = rgba(f9e2afee) # Caps Lock이 켜지면 테두리가 노란색

    font_color = $text
    fade_on_empty = false
    rounding = -1
    dots_center = true

    font_family = $font
    placeholder_text = 암호 입력
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock이 켜져 있으면 암호 칸 아래에 표시
label {
    monitor =
    text = cmd[update:300] cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | grep -q 1 && echo "󰘲 Caps Lock 켜짐"
    color = rgb(f9e2af)
    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -85
    halign = center
    valign = center
}

# 배터리
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $text
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = -30, 30
    halign = right
    valign = bottom
}

# 좌하단 입력기 배지 (상단바와 같은 모양). 누르면 A → 한 → あ 순서로 바뀐다.
# 잠금 화면의 암호 입력은 입력기와 상관없이 항상 영문이라, 이건 잠금을 푼 뒤의 입력 상태를 바꾸는 것이다
shape {
    monitor =
    size = 30, 24
    color = rgba(cdd6f4ff)
    rounding = 6
    border_size = 0
    onclick = ~/.config/hypr/scripts/ime-cycle.sh

    position = 30, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:500] case "$(fcitx5-remote -n 2>/dev/null)" in hangul) echo 한 ;; mozc) echo あ ;; *) echo A ;; esac
    color = rgb(1e1e2e)
    font_size = 11
    font_family = Noto Sans CJK KR
    onclick = ~/.config/hypr/scripts/ime-cycle.sh

    position = 39, 32
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:500] case "$(fcitx5-remote -n 2>/dev/null)" in hangul) echo 한글 입력 ;; mozc) echo 일본어 입력 ;; *) echo 영어 입력 ;; esac
    color = $text
    font_size = 12
    font_family = $font
    onclick = ~/.config/hypr/scripts/ime-cycle.sh

    position = 70, 33
    halign = left
    valign = bottom
}
