# hyprlock: 잠금 화면. 공식 예시(hyprlock v0.9.6 assets/example.conf)를 줄였다.
# 입력 중인 암호 지우기: ESC, Ctrl+U

$font = Noto Sans

general {
    hide_cursor = true
}

# 지문으로 풀려면 fprintd로 지문을 등록한 뒤 주석을 푼다.
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = 지문을 대세요
#         present_message = 확인 중...
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = 암호 입력
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d (%a)"
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
