# hypridle: 가만히 두면 화면을 어둡게 하고, 잠그고, 끄고, 절전한다.
# 공식 위키 예시(https://wiki.hypr.land/Hypr-Ecosystem/hypridle/)에서 키보드 백라이트 부분만 뺐다.

general {
    lock_cmd = pidof hyprlock || hyprlock                                    # 잠금 화면을 하나만 띄운다
    before_sleep_cmd = loginctl lock-session                                 # 덮개를 닫거나 절전하기 전에 잠근다
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # 깨어날 때 키를 두 번 누르지 않게
}

listener {
    timeout = 150                         # 2분 30초: 화면 어둡게
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                         # 5분: 잠금
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                         # 5분 30초: 화면 끄기
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 1800                        # 30분: 절전
    on-timeout = systemctl suspend
}
