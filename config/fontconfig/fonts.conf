<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 웹페이지가 맥 전용으로 지정한 글꼴 이름을 Inter로 보여 준다. 한글은 Noto Sans CJK KR -->
<fontconfig>
  <alias binding="same">
    <family>-apple-system</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>BlinkMacSystemFont</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>SF Pro Display</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>SF Pro Text</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>

  <!-- 한글(Noto Sans CJK)은 힌팅을 끈다. 이 글꼴(CFF)에 slight 힌팅을 걸면 윗 가로획이 0.5px쯤 위로 붙는데,
       GTK4 앱(Nautilus, swaync 등)은 힌팅 전 크기로 글자 칸을 잡아서 맨 윗줄이 잘린다 (11·12px에서 '조'가 '소'로 보임) -->
  <match target="font">
    <test name="family" compare="contains"><string>CJK</string></test>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
</fontconfig>
