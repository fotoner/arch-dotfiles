# 노트북 HDMI·DisplayPort 소리 출력(HDMI1~3)을 숨긴다. 음량 창·알림 센터에는 스피커·이어폰 같은 실제 장치만 보인다.
# HDMI 모니터로 소리를 내야 하면 이 파일을 지우고: systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HDMI.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
