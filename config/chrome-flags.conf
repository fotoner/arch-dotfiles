# Google Chrome 실행 옵션 (google-chrome 패키지의 실행 스크립트가 읽는다). '#'로 시작하는 줄만 주석으로 쓸 수 있다
# 영상 하드웨어 가속: 유튜브 같은 영상을 인텔 GPU(VA-API, intel-media-driver)로 풀어 CPU 사용량·발열·배터리 소모를 줄인다.
# 확인: chrome://gpu 의 "Video Decode: Hardware accelerated", 또는 재생 중 chrome://media-internals 의 VaapiVideoDecoder
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
# 이 GPU(10세대 인텔)는 AV1을 하드웨어로 못 풀어서, 유튜브가 AV1로 보내는 영상은 CPU(dav1d)가 푼다.
# 유튜브 HD·4K를 GPU로 풀려면 youtube.com/account_playback 의 'AV1 설정'을 'SD 동영상에 AV1 선호'로 바꾼다 (HD는 VP9으로 온다).
# (Chrome 155에서는 --disable-features=Dav1dVideoDecoder 로 AV1을 끌 수 없다. 넣어도 dav1d가 그대로 돈다)
